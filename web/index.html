<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Trolley watch: whose food inflation?</title>
    <meta name="description" content="The ONS's food price index rebuilt from 2.2 million shop prices, split into the cheapest, middle and dearest third of the shelf, January 2021 to December 2024. Tick what you buy to see your own trolley's rise." />
    <meta name="theme-color" content="#f5f6f4" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#121516" media="(prefers-color-scheme: dark)" />
    <meta property="og:title" content="Did your end of the shelf rise faster than food inflation?" />
    <meta property="og:description" content="The cheapest third of shelf prices rose 38.5% from January 2021 to December 2024. Food as a whole: 33.3%." />
    <meta property="og:type" content="website" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='2' y='1' width='3' height='14' fill='%23d63f3e'/%3E%3Crect x='6.5' y='5' width='3' height='10' fill='%239aa1a0'/%3E%3Crect x='11' y='9' width='3' height='6' fill='%232a78d6'/%3E%3C/svg%3E" />

      try {
        var t = localStorage.getItem("theme");
        if (t === "light" || t === "dark") document.documentElement.dataset.theme = t;
      } catch (e) {}
    </script>
  </head>
